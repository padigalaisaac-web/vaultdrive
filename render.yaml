services:
  # Backend Web Service
  - type: web
    name: vaultdrive-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./storage
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: vaultdrive-frontend
          property: url

  # Frontend Static Site
  - type: web
    name: vaultdrive-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule so React Router routes don't return 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vaultdrive-backend
          property: url
          format: ${VALUE}/api
